name: DEV → STAGE DB deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.TEST_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.STAGE_IP }} >> ~/.ssh/known_hosts

      - name: Check schema on TEST
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.TEST_IP }} \
          "cd electronic_library && bash scripts/check_schema.sh library.db"

      - name: Check schema on STAGE
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.STAGE_IP }} \
          "cd electronic_library && bash scripts/check_schema.sh library.db"

      - name: Deploy migration to STAGE
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.STAGE_IP }} \
          "cd electronic_library && sqlite3 library.db < db/migrate.sql"
